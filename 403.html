<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>403 – Không có quyền truy cập | SiteSafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="ss-landing">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card text-center">
          <div class="card-body p-4 p-lg-5">
            <div class="ss-kpi-icon mx-auto mb-3" style="width:64px;height:64px;font-size:1.8rem"><i class="bi bi-shield-lock"></i></div>
            <p class="ss-row-code">LỖI 403</p>
            <h1 class="h3 mb-2">Vai trò hiện tại không được xem màn hình này</h1>
            <p class="text-muted-soft mb-1" id="explain">Bạn đang đăng nhập bằng một vai trò khác với vai trò của màn hình bạn mở.</p>
            <p class="small text-muted-soft" id="who"></p>
            <div class="d-flex flex-wrap gap-2 justify-content-center mt-4">
              <button class="btn btn-primary" id="switchRole"><i class="bi bi-arrow-repeat me-1"></i>Đăng nhập bằng vai trò phù hợp</button>
              <a class="btn btn-ghost" id="goHome" href="index.html"><i class="bi bi-house-door me-1"></i>Về trang giới thiệu</a>
              <a class="btn btn-ghost" id="goLogin" href="login.html"><i class="bi bi-person-badge me-1"></i>Đăng nhập tài khoản khác</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/modules/seed-data.js"></script>
  <script src="js/modules/store.js"></script>
  <script>
    (function () {
      var store = window.SiteSafeStore;
      var A = { ROLE_LABEL: { worker: 'Nhân sự hiện trường', safety: 'Cán bộ an toàn', manager: 'Quản lý công trường', admin: 'Quản trị viên' } };
      var params = new URLSearchParams(location.search);
      var need = params.get('need');
      var s = store.session();
      var NAV = {
        worker: 'worker/worker-safety-checklist.html',
        safety: 'safety/safety-dashboard.html',
        manager: 'manager/manager-zone-risk-map.html',
        admin: 'admin/admin-checklist-template-management.html'
      };
      if (need && A.ROLE_LABEL[need]) {
        document.getElementById('explain').textContent =
          'Màn hình bạn mở thuộc phạm vi “' + A.ROLE_LABEL[need] + '”.' +
          (s ? ' Phiên hiện tại đang là “' + A.ROLE_LABEL[s.role] + '” nên hệ thống chặn truy cập theo ma trận quyền.' : '');
        document.getElementById('who').textContent = s ? 'Người dùng: ' + s.name + ' · ' + (s.username || s.userId) : 'Chưa có phiên đăng nhập.';
        document.getElementById('switchRole').addEventListener('click', function () {
          location.href = 'login.html?switch=1&next=' + encodeURIComponent(NAV[need]);
        });
      } else {
        document.getElementById('switchRole').addEventListener('click', function () { location.href = 'login.html'; });
      }
    })();
  </script>
</body>
</html>
