<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nguy cơ của tôi – SiteSafe</title>
  <meta name="description" content="Tìm kiếm, lọc và theo dõi trạng thái xử lý các báo cáo nguy cơ bạn đã gửi.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body data-root=".." data-role="worker" data-scr="03" data-active="worker/worker-my-hazards.html"
  data-title="Nguy cơ của tôi" data-subtitle="Theo dõi phản hồi xử lý cho từng báo cáo bạn đã gửi">

  <div class="ss-app">
    <aside id="ssSidebar" class="ss-sidebar"></aside>
    <div class="ss-main">
      <header id="ssTopbar" class="ss-topbar"></header>
      <main class="ss-content">
        <div class="offcanvas offcanvas-start d-lg-none ss-offcanvas" tabindex="-1" id="ssOffcanvasNav"
          aria-labelledby="ssOffcanvasTitle">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="ssOffcanvasTitle" style="color:#fff">Menu vai trò</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Đóng"></button>
          </div>
          <div class="offcanvas-body" id="ssOffcanvasBody"></div>
        </div>

        <div class="row g-3 mb-3" id="kpis"></div>

        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-lg-4">
                <label class="form-label small mb-1" for="q">Tìm kiếm</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-search"></i></span>
                  <input class="form-control" id="q" placeholder="Theo mã, tiêu đề hoặc mô tả…"
                    aria-label="Tìm kiếm trong báo cáo của bạn">
                  <button class="btn btn-ghost" type="button" id="clearQ" title="Xóa từ khóa"><i
                      class="bi bi-x-lg"></i></button>
                </div>
              </div>
              <div class="col-6 col-lg-2">
                <label class="form-label small mb-1" for="fStatus">Trạng thái</label>
                <select class="form-select" id="fStatus"></select>
              </div>
              <div class="col-6 col-lg-2">
                <label class="form-label small mb-1" for="fLevel">Mức độ</label>
                <select class="form-select" id="fLevel"></select>
              </div>
              <div class="col-6 col-lg-2">
                <label class="form-label small mb-1" for="fZone">Khu vực</label>
                <select class="form-select" id="fZone"></select>
              </div>
              <div class="col-6 col-lg-2">
                <label class="form-label small mb-1" for="fSort">Sắp xếp</label>
                <select class="form-select" id="fSort">
                  <option value="new">Mới nhất trước</option>
                  <option value="old">Cũ nhất trước</option>
                  <option value="level">Mức độ giảm dần</option>
                  <option value="zone">Theo khu vực</option>
                </select>
              </div>
            </div>
            <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
              <span class="ss-row-meta" id="resultCount" aria-live="polite">—</span>
              <div class="nav nav-pills gap-1 ms-auto" id="quickFilters">
                <button class="nav-link py-1 px-2 small active" data-quick="all">Tất cả</button>
                <button class="nav-link py-1 px-2 small" data-quick="open">Đang mở</button>
                <button class="nav-link py-1 px-2 small" data-quick="stuck">Chờ cán bộ an toàn</button>
                <button class="nav-link py-1 px-2 small" data-quick="mine">Cần tôi bổ sung</button>
              </div>
              <button class="btn btn-ghost btn-sm" id="resetFilters"><i
                  class="bi bi-arrow-counterclockwise me-1"></i>Xóa bộ lọc</button>
            </div>
          </div>
        </div>

        <div id="list" aria-live="polite"></div>
        <div id="ssOwnerNote" class="mt-4"></div>
      </main>
    </div>
  </div>


  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <form class="modal-content" id="editForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="editTitle">Bổ sung thông tin báo cáo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body">
          <div id="editWhy" class="alert py-2 small" style="background:#fdf6e3;border:1px solid #f2dda3"></div>
          <div class="mb-3">
            <label class="form-label" for="eTitle">Tiêu đề <span class="text-danger">*</span></label>
            <input class="form-control" id="eTitle" maxlength="90" required>
            <div class="invalid-feedback">Tiêu đề cần tối thiểu 6 ký tự.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="eDesc">Mô tả bổ sung <span class="text-danger">*</span></label>
            <textarea class="form-control" id="eDesc" rows="4" required minlength="25"></textarea>
            <div class="invalid-feedback">Nội dung cần tối thiểu 25 ký tự.</div>
          </div>
          <div class="mb-0">
            <label class="form-label" for="eNote">Gửi kèm ghi chú cho cán bộ an toàn</label>
            <input class="form-control" id="eNote" placeholder="Ví dụ: đã bổ sung ảnh chụp lúc 15h20">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Gửi bổ sung</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/modules/seed-data.js"></script>
  <script src="../js/modules/store.js"></script>
  <script src="../js/modules/app.js"></script>
  <script src="../js/pages/worker-my-hazards.js"></script>
</body>

</html>
