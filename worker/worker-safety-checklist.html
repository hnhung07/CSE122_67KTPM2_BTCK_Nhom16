<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist an toàn – SiteSafe</title>
  <meta name="description" content="Mở checklist được giao, đánh giá từng mục, ghi chú và gửi kết quả cho cán bộ an toàn.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-root=".." data-role="worker" data-scr="01"
      data-active="worker/worker-safety-checklist.html"
      data-title="Checklist an toàn"
      data-subtitle="Đánh giá từng mục kiểm tra và gửi kết quả cho cán bộ an toàn">

  <div class="ss-app">
    <aside id="ssSidebar" class="ss-sidebar"></aside>
    <div class="ss-main">
      <header id="ssTopbar" class="ss-topbar"></header>
      <main class="ss-content">
        <div class="offcanvas offcanvas-start d-lg-none ss-offcanvas" tabindex="-1" id="ssOffcanvasNav" aria-labelledby="ssOffcanvasTitle">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="ssOffcanvasTitle" style="color:#fff">Menu vai trò</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Đóng"></button>
          </div>
          <div class="offcanvas-body" id="ssOffcanvasBody"></div>
        </div>

        <div class="row g-3 g-xl-4">
          <div class="col-lg-4 col-xxl-3">
            <div class="card mb-3">
              <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-journal-check me-1"></i>Checklist được giao</span>
                <span class="ss-badge ss-lv-Antoan" id="runCount">0</span>
              </div>
              <div class="card-body p-2">
                <div class="nav nav-pills gap-1 mb-2 p-1" id="runFilter" role="tablist">
                  <button class="nav-link py-1 px-2 small active" data-filter="all">Tất cả</button>
                  <button class="nav-link py-1 px-2 small" data-filter="open">Cần làm</button>
                  <button class="nav-link py-1 px-2 small" data-filter="done">Đã gửi</button>
                </div>
                <div id="runList" aria-live="polite"></div>
              </div>
            </div>
            <div class="alert small mb-0" style="background:var(--ss-teal-50);border:1px solid var(--ss-teal-100)">
              <i class="bi bi-lightbulb me-1" style="color:var(--ss-teal-700)"></i>
              Kết quả đánh giá được lưu ngay khi bạn chọn, nên có thể làm tiếp khi mất mạng hoặc hết pin giữa ca.
            </div>
          </div>

          <div class="col-lg-8 col-xxl-9">
            <div id="detail" aria-live="polite"></div>
          </div>
        </div>
        <div id="ssOwnerNote" class="mt-4"></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/modules/seed-data.js"></script>
  <script src="../js/modules/store.js"></script>
  <script src="../js/modules/app.js"></script>
  <script src="../js/pages/worker-safety-checklist.js"></script>
</body>
</html>
