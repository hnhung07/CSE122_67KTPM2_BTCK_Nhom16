<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết &amp; xem xét nguy cơ – SiteSafe</title>
  <meta name="description" content="Xem nội dung báo cáo nguy cơ, cập nhật trạng thái, ghi chú review và giao hành động khắc phục.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-root=".." data-role="safety" data-scr="05"
      data-active="safety/safety-hazard-detail.html"
      data-title="Chi tiết &amp; xem xét nguy cơ"
      data-subtitle="Xác minh nội dung báo cáo, cập nhật phân loại và giao hành động khắc phục">

  <div class="ss-app">
    <aside id="ssSidebar" class="ss-sidebar"></aside>
    <div class="ss-main">
      <header id="ssTopbar" class="ss-topbar"></header>
      <main class="ss-content">
        <div class="offcanvas offcanvas-start d-lg-none ss-offcanvas" tabindex="-1" id="ssOffcanvasNav" aria-labelledby="ssOffcanvasTitle">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="ssOffcanvasTitle" style="color:#fff">Menu vai trò</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Đóng"></button>
          </div>
          <div class="offcanvas-body" id="ssOffcanvasBody"></div>
        </div>

        <div id="hazardView"></div>
        <div id="ssOwnerNote" class="mt-4"></div>
      </main>
    </div>
  </div>

  <!-- modal xem ảnh -->
  <div class="modal fade" id="imgModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="imgModalTitle">Ảnh minh chứng</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
      <div class="modal-body text-center p-2"><img id="imgModalSrc" class="img-fluid rounded" alt="Phóng to ảnh minh chứng"></div>
    </div></div>
  </div>

  <!-- modal giao hành động khắc phục -->
  <div class="modal fade" id="assignModal" tabindex="-1" aria-labelledby="assignTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="assignForm" novalidate>
        <div class="modal-header"><h5 class="modal-title" id="assignTitle">Giao hành động khắc phục</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="aTitle">Nội dung cần làm <span class="text-danger">*</span></label>
            <input class="form-control" id="aTitle" maxlength="110" required placeholder="Ví dụ: Lắp lại lan can nhịp C2 và nghiệm thu trước khi cho làm việc">
            <div class="invalid-feedback">Hãy mô tả việc cần làm, tối thiểu 10 ký tự.</div>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="aOwner">Người phụ trách <span class="text-danger">*</span></label>
              <select class="form-select" id="aOwner" required></select>
              <div class="invalid-feedback">Chọn người phụ trách còn hoạt động.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="aDue">Hạn xử lý <span class="text-danger">*</span></label>
              <input class="form-control" type="date" id="aDue" required>
              <div class="invalid-feedback" id="aDueErr">Hạn xử lý phải là ngày hôm nay hoặc muộn hơn.</div>
            </div>
          </div>
          <div class="mt-3">
            <label class="form-label" for="aNote">Ghi chú cho người thực hiện</label>
            <textarea class="form-control" id="aNote" rows="2" placeholder="Dụng cụ cần chuẩn bị, khu vực phong tỏa, đầu mối liên hệ…"></textarea>
          </div>
          <div class="alert small mt-3 mb-0 py-2" style="background:var(--ss-teal-50);border:1px solid var(--ss-teal-100)" id="assignSuggest"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Giao và báo cho người phụ trách</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/modules/seed-data.js"></script>
  <script src="../js/modules/store.js"></script>
  <script src="../js/modules/app.js"></script>
  <script src="../js/modules/ai.js"></script>
  <script src="../js/pages/safety-hazard-detail.js"></script>
</body>
</html>
